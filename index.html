 <!DOCTYPE html> 
<script>
window.addEventListener("DOMContentLoaded", () => {
  alert(
    "GULVIONEX Compatibility Test\n\n" +
    "WebGPU: " + (navigator.gpu ? "Available" : "Unavailable") +
    "\nWebAssembly: " + (typeof WebAssembly !== "undefined" ? "Available" : "Unavailable") +
    "\nVoice: " + ("speechSynthesis" in window ? "Available" : "Unavailable")
  );
});
</script>


<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GULVIONEX AI 2.0</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: -apple-system, Arial, sans-serif;
  background: #080b14;
  color: #ffffff;
}
.app {
  display: flex;
  height: 100dvh;
}
.sidebar {
  width: 240px;
  padding: 22px;
  background: #101522;
  border-right: 1px solid #262b40;
  display: flex;
  flex-direction: column;
}
.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #b9a0ff;
}
.tagline {
  font-size: 9px;
  letter-spacing: 2px;
  color: #8991aa;
  margin-top: 8px;
}
button {
  font: inherit;
  cursor: pointer;
  color: white;
}
.new-chat {
  margin-top: 30px;
  padding: 13px;
  background: #201b36;
  border: 1px solid #8b5cf6;
  border-radius: 12px;
}
.history-title {
  margin-top: 30px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #8991aa;
}
#history {
  overflow-y: auto;
}
.history-item {
  width: 100%;
  background: transparent;
  border: 0;
  text-align: left;
  padding: 12px 0;
  color: #b9bfd4;
}
.sidebar-footer {
  margin-top: auto;
  color: #8991aa;
  font-size: 12px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: radial-gradient(
    ellipse at center,
    #17152c 0%,
    #080b14 65%
  );
}
header {
  padding: 20px;
  border-bottom: 1px solid #ffffff12;
  display: flex;
  align-items: center;
  gap: 12px;
}
header strong {
  font-size: 17px;
}
.status {
  margin-left: auto;
  color: #00d9ff;
  font-size: 11px;
}
.menu {
  display: none;
  background: transparent;
  border: 0;
  font-size: 23px;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
}
.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.orb {
  width: 155px;
  height: 155px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(
    circle at 35% 30%,
    #ffffff,
    #00d9ff 15%,
    #6755f5 40%,
    #25164e 70%
  );
  box-shadow:
    0 0 40px #8b5cf688,
    0 0 90px #00d9ff44,
    inset 0 0 25px #00d9ff;
  animation: breathe 4s ease-in-out infinite;
}
.orb::before,
.orb::after {
  content: "";
  position: absolute;
  inset: -12px;
  border: 1px solid #00d9ff99;
  border-radius: 50%;
  animation: orbit 6s linear infinite;
}
.orb::after {
  inset: -23px;
  border-color: #8b5cf699;
  animation-direction: reverse;
}
@keyframes breathe {
  50% {
    transform: scale(1.08);
    filter: brightness(1.2);
  }
}
@keyframes orbit {
  from { transform: rotate(0deg) scaleY(.65); }
  to { transform: rotate(360deg) scaleY(.65); }
}
h1 {
  margin: 48px 0 10px;
  font-size: clamp(24px, 4vw, 38px);
}
.subtitle {
  color: #a0a6be;
  line-height: 1.6;
}
.suggestions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 22px;
}
.suggestions button {
  background: #ffffff08;
  border: 1px solid #34304c;
  border-radius: 12px;
  padding: 12px;
}
.composer {
  padding: 15px 20px;
}
.input-box {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 850px;
  margin: auto;
  padding: 12px;
  background: #151b2d;
  border: 1px solid #514477;
  border-radius: 20px;
}
textarea {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  font: inherit;
  font-size: 16px;
}
.send {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: 0;
  background: linear-gradient(
    135deg, #8b5cf6, #4169e1
  );
  font-size: 22px;
}
.note {
  text-align: center;
  font-size: 11px;
  color: #8991aa;
  margin-top: 12px;
}
.message {
  max-width: 85%;
  width: fit-content;
  padding: 15px 18px;
  border-radius: 16px;
  margin: 15px 0;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user {
  margin-left: auto;
  background: #30234e;
}
.assistant {
  background: #151b2d;
  border: 1px solid #ffffff12;
}
@media(max-width: 700px) {
  .sidebar {
    display: none;
  }
  .sidebar.open {
    display: flex;
    position: absolute;
    height: 100%;
    z-index: 10;
  }
  .menu {
    display: block;
  }
  .orb {
    width: 120px;
    height: 120px;
  }
}
@media(prefers-reduced-motion: reduce) {
  .orb, .orb::before, .orb::after {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">GULVIONEX</div>
  <div class="tagline">INTELLIGENCE BEYOND LIMITS</div>
  <button class="new-chat" onclick="newChat()">
    + New chat
  </button>
  <div class="history-title">CHAT HISTORY</div>
  <div id="history"></div>
  <div class="sidebar-footer">
    GULVIONEX AI 2.0<br><br>
    Development Edition
  </div>
</aside>

<main class="main">
  <header>
    <button class="menu" onclick="toggleMenu()">
      ☰
    </button>
    <strong>GULVIONEX AI 2.0</strong>
    <span class="status">● UI MODE</span>
  </header>

  <div id="messages"></div>

  <div class="composer">
    <div class="input-box">
      <textarea id="input" rows="2"
        placeholder="Ask me anything..."></textarea>
      <button class="send" onclick="sendMessage()"
        aria-label="Send message">↑</button>
    </div>
    <div class="note">
      GULVIONEX AI • Development preview
    </div>
  </div>
</main>
</div>

<script>
let chats = [];
try {
  chats = JSON.parse(
    localStorage.getItem("gulvionex-chats") || "[]"
  );
  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

let activeChat = null;

function saveChats() {
  try {
    localStorage.setItem(
      "gulvionex-chats",
      JSON.stringify(chats)
    );
  } catch {
    console.warn("Local storage unavailable");
  }
}

function welcome() {
  document.getElementById("messages").innerHTML = `
    <div class="welcome">
      <div class="orb"></div>
      <h1>How can I help you?</h1>
      <div class="subtitle">
        Your personal AI assistant.<br>
        Intelligence Beyond Limits.
      </div>
      <div class="suggestions">
        <button onclick="suggest('Help me study')">
          ✦ Study
        </button>
        <button onclick="suggest('Help me write code')">
          &lt;/&gt; Coding
        </button>
        <button onclick="suggest('Give me creative ideas')">
          ◇ Create
        </button>
      </div>
    </div>`;
}

function suggest(text) {
  document.getElementById("input").value = text;
  document.getElementById("input").focus();
}

function toggleMenu() {
  document.getElementById("sidebar")
    .classList.toggle("open");
}

function newChat() {
  activeChat = null;
  document.getElementById("input").value = "";
  document.getElementById("sidebar")
    .classList.remove("open");
  welcome();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.replaceChildren();

  chats.forEach((chat, index) => {
    const button = document.createElement("button");
    button.className = "history-item";
    button.textContent = chat.title;
    button.onclick = () => {
      activeChat = index;
      renderMessages();
      document.getElementById("sidebar")
        .classList.remove("open");
    };
    history.appendChild(button);
  });
}

function renderMessages() {
  const area = document.getElementById("messages");
  area.replaceChildren();

  if (activeChat === null) {
    welcome();
    return;
  }

  chats[activeChat].messages.forEach(message => {
    const div = document.createElement("div");
    div.className = "message " + message.role;
    div.textContent = message.text;
   if (message.role === "assistant") {
  const speaker = document.createElement("button");
  speaker.textContent = "🔊 Read Aloud";
  speaker.style.cssText = `
    display: block;
    margin-top: 12px;
    background: transparent;
    color: #b6a0ff;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 6px;
  `;

  speaker.onclick = () => {
    if ("speechSynthesis" in window) {
     window.speechSynthesis.cancel();
   const parts = message.text.split(/(gulvionex|[\u0900-\u097F]+(?:\s+[\u0900-\u097F]+)*)/gi);

parts.forEach(part => {
  if (!part.trim()) return;

  const isBrand = /^gulvionex$/i.test(part);
  const isHindi = /[\u0900-\u097F]/.test(part);

  const voice = new SpeechSynthesisUtterance(
    isBrand ? "गुलवियोनेक्स" : part
  );

  voice.lang = isBrand || isHindi ? "hi-IN" : "en-US";

  voice.rate = 1;
  voice.pitch = 1;
  voice.volume = 1;

  window.speechSynthesis.speak(voice);
});   
    } else {
      alert("Voice is not supported.");
    }
  };

  div.appendChild(speaker);
}
   
    area.appendChild(div);
  });

  area.scrollTop = area.scrollHeight;
}

 let aiEngine = null;
let aiBusy = false;

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text || aiBusy) return;

  aiBusy = true;

  if (activeChat === null) {
    chats.unshift({
      title: text.slice(0, 30),
      messages: []
    });
    activeChat = 0;
  }

  const chat = chats[activeChat];

  chat.messages.push({
    role: "user",
    text: text
  });

  input.value = "";

  const reply = {
    role: "assistant",
    text: "Loading GULVIONEX AI..."
  };

  chat.messages.push(reply);
  renderMessages();
  renderHistory();

  try {
    if (!aiEngine) {
      const webllm = await import(
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.89/+esm"
      );

      aiEngine = await webllm.CreateMLCEngine(
        "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
        {
          initProgressCallback: (report) => {
            reply.text = report.text;
            renderMessages();
          }
        }
      );
    }

    reply.text = "Thinking...";
    renderMessages();

    const result = await aiEngine.chat.completions.create({
      messages: [
        {
          role: "system",
          content: "You are GULVIONEX AI, a helpful personal AI assistant."
        },
        ...chat.messages
          .slice(0, -1)
          .map(m => ({
            role: m.role,
            content: m.text
          }))
      ],
      max_tokens: 512
    });

    reply.text = result.choices[0].message.content;
if ("speechSynthesis" in window) {
  const voice = new SpeechSynthesisUtterance(reply.text);
  voice.lang = /[\u0900-\u097F]/.test(reply.text)
    ? "hi-IN" : "en-IN";
  voice.rate = 1;
  voice.pitch = 1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(voice);
}
  } catch (error) {
    reply.text = "AI Error: " + error.message;
  } finally {
    aiBusy = false;
    saveChats();
    renderMessages();
    renderHistory();
  }
} 

document.getElementById("input")
  .addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

welcome();
renderHistory();
</script>
</body>
</html>
